<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tienda</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            background-color: rgb(187, 182, 182);
            padding: 20px;
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
        }
        #ficha {
            background-color: rgb(212, 208, 208);
            border-radius: 30px;
            width: 100%;
            max-width: 1000px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        #Cabecera {
            display: flex;
            background-color: rgb(145, 141, 202);
            color: rgb(250, 250, 250);
            width: 100%;
            border-radius: 20px;
            padding: 10px;
            justify-content: center;
            align-items: center;
        }
        #Cabecera h1 {
            margin: 0;
            font-size: 24px;
        }
        #tarjeta {
            background-color: rgb(199, 189, 193);
            width: 100%;
            margin-top: 20px;
            border-radius: 30px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        #imagen {
            width: 100%;
            background-color: rgb(250, 249, 251);
            border-radius: 15px;
            overflow: hidden;
        }
        img {
            width: 100%;
            height: auto;
            max-height: 350px;
            object-fit: cover;
            display: block;
            border-radius: 15px;
        }
        #descripcion {
            width: 100%;
            background-color: rgb(250, 249, 251);
            padding: 20px;
            border-radius: 15px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            gap: 15px;
        }
        #texto {
            text-align: center;
            font-size: 16px;
        }
        #texto p {
            margin: 8px 0;
        }
        #boton {
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #comprar {
            background-color: rgb(255, 244, 230);
            color: rgb(0, 0, 0);
            padding: 10px 20px;
            font-size: 15px;
            border-radius: 15px;
            border: 1px solid #ccc;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
        }

        @media (min-width: 768px) {
            #tarjeta {
                flex-direction: row;
                align-items: stretch;
            }
            #imagen {
                width: 45%;
            }
            img {
                height: 100%;
                max-height: none;
            }
            #descripcion {
                width: 55%;
            }
        }
    </style>
</head>
<body>
    <div id="ficha"> 
        <div id="Cabecera">
            <h1>Tienda</h1>
        </div>
        <div id="tarjeta">
            <div id="imagen">
                <img src="{{ url_for('static', filename='manzana2.jpg') }}" alt="Manzana Encaramelada">
            </div>
            <div id="descripcion">
                <div id="texto">
                    <p style="font-weight: bold; font-size: 20px;">Manzanas Encarameladas</p>
                    <p>Manzanas rojas cubiertas por una dulce capa de caramelo de azúcar derretida</p>
                </div>
                <div id="boton">
                    <a href="/preencargo" id="comprar">Encargar</a>
                </div>
            </div>
        </div>
        <div id="Pie"></div>
    </div>
</body>
</html>
